name: refresh-voting-scores-cron

# フェーズ8：マテビュー game_voting_scores の REFRESH（10分ごと）
# Vercel Hobby は daily cron のみのため GitHub Actions から叩く構成
# （fetch-games-cron と同じパターン）

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-voting-scores-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit Vercel refresh endpoint
        env:
          REFRESH_TARGET_URL: ${{ secrets.REFRESH_TARGET_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REFRESH_TARGET_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::REFRESH_TARGET_URL or CRON_SECRET not set"
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$REFRESH_TARGET_URL")
          echo "HTTP $http_code"
          cat /tmp/resp.json || true
          echo ""
          if [ "$http_code" != "200" ]; then
            exit 1
          fi

# ─────────────────────────────────────────────────────────────
# 注意：GitHub は「リポジトリに 60 日間コミットが無い」と schedule を
# 自動で無効化する（workflow state が disabled_inactivity になる）。
# 通知は実質届かず、サイトは表示上壊れないため気づきにくい。
#   実例：2026-08-02 を最後に無活動 → 2026-10-01 に 4 本とも停止 →
#         2026-10-24 に発見。23 日間 CCU スナップショットが欠損した。
#
# 復帰手順：
#   1. gh workflow enable <name>            … state を active に戻す
#   2. このファイルに触れて default branch に push
#      ← 2 が必須。1 だけでは cron タイマーが再登録されず発火しない
#         （2026-10-25 に実測：state=active でも 1 時間以上発火 0 回）
#
# 予防：月 1 回でも何かコミットすれば 60 日カウンタはリセットされる。
# 監視：トップpage の「N分前更新」が数時間以上古ければ停止を疑う。
# ─────────────────────────────────────────────────────────────
